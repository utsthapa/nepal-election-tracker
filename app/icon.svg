<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Ballot box body -->
  <rect x="4" y="12" width="24" height="17" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="0.5"/>
  <!-- Ballot slot -->
  <rect x="11" y="13.5" width="10" height="2" rx="0.5" fill="#334155"/>
  <!-- Ballot paper -->
  <rect x="12.5" y="3" width="7" height="13" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5" transform="rotate(-8 16 9)"/>
  <!-- Vote check mark on ballot -->
  <path d="M14 8.5 L15.5 10.5 L19 6" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-8 16 9)"/>
  <!-- Box front detail line -->
  <line x1="4" y1="19" x2="28" y2="19" stroke="#334155" stroke-width="0.5"/>
  <!-- Subtle data bars on box front -->
  <rect x="9" y="21" width="3" height="6" rx="0.5" fill="#dc2626" opacity="0.8"/>
  <rect x="14" y="22.5" width="3" height="4.5" rx="0.5" fill="#2563eb" opacity="0.8"/>
  <rect x="19" y="20" width="3" height="7" rx="0.5" fill="#dc2626" opacity="0.8"/>
</svg>
